# ModalAI Starling 2 Max — measured vehicle constants.
#
# Source: AirLab sys-ID campaign (Neelay Joglekar),
# https://airlab.slite.com/app/docs/dj1982T35dt0qG ("Starling 2 Max Sys ID
# Results", 2026-06). USD with these already applied:
# omniverse://airlab-nucleus.andrew.cmu.edu/Library/Assets/ModalAI/starling_2_max/starling2max.usd
#
# This file is the repo's single source of truth: training overrides,
# the Pegasus vehicle config, and MPC bounds all derive from it. The sys-ID
# CAD frame is X-left / Y-up / Z-forward; everything below is already
# converted to body FLU (x forward, y left, z up).

mass_kg: 0.557

# Diagonal inertia about the CoM [kg m^2], FLU axes. CAD->FLU mapping:
# roll (about fwd) = CAD Z, pitch (about left) = CAD X, yaw (about up) = CAD Y.
inertia_flu:
  ixx_roll: 2.9434089e-3
  iyy_pitch: 1.8574305e-3
  izz_yaw: 4.6494552e-3

# Center of mass offset (FLU, metres): essentially centered; 7.41 mm up.
com_offset_flu_m: [0.00102, 0.000016, 0.00741]

rotor:
  # F = k_T * omega^2  [N per (rad/s)^2]
  thrust_constant: 3.964738e-6
  # tau_rotor = k_M * omega^2  [Nm per (rad/s)^2]
  rolling_moment_coefficient: 5.38697e-8
  # k_M / k_T [m] -- diffaero's c_tau; sys-ID gives 0.013587
  torque_to_thrust_ratio: 0.013587
  # First-order motor lag [s]: ~55 ms spin-up / ~85 ms spin-down,
  # 72 +/- 2.5 ms under agile throttle changes (frequency response).
  time_constant_s: 0.072
  time_constant_up_s: 0.055
  time_constant_down_s: 0.085

# NOT in the sys-ID doc: max prop speed / max thrust. ASSUMED thrust-to-weight
# = 2.0 (decision 2026-08-17; matches the harness's long-standing
# MAX_ACCEL = 20 m/s^2 deploy convention within 2%). Everything below derives
# from that assumption — retighten when a measured number lands.
assumed:
  thrust_to_weight: 2.0
  max_thrust_total_n: 10.929         # 2.0 * m * g
  max_thrust_accel_mps2: 19.62       # 2.0 * g
  # box clamp for point-mass trainers: z = full vertical thrust accel;
  # xy = horizontal component at full thrust with 1 g held vertically
  # (= g * sqrt(T/W^2 - 1) = g*sqrt(3))
  max_acc_z_mps2: 19.6
  max_acc_xy_mps2: 17.0
  # per-rotor: omega_max = sqrt((max_thrust_total/4) / k_T)
  max_rotor_velocity_rad_s: 830.0
  hover_rotor_velocity_rad_s: 587.0  # sqrt((m*g/4)/k_T)
  hover_throttle: 0.5                # g / max_thrust_accel

# diffaero pmc mapping (see dynamics/pointmass.py):
#   a_dot = ((1-exp(-lmbda*dt))/dt) * (a_cmd - a)  =>  lmbda ~= 1/tau_motor.
#   lmbda default 13.9 (tau 72 ms), randomized [11.8, 18.2] (tau 85..55 ms).
diffaero_pmc:
  lmbda_default: 13.9
  lmbda_min: 11.8
  lmbda_max: 18.2

# Airframe geometry, measured 2026-09-29 from the USDs themselves (pxr on
# airstation03: every mesh point in the body frame, props as SWEPT discs about
# their joint axes; script scripts/vehicle_extents.py). Body frame = the
# `body` rigid body = the pose PX4 / the harness log, FLU, metres.
geometry:
  # --vehicle starling2max: the lab USD (omniverse://.../starling2max.usd)
  usd_rotor_xy_m: [0.095, 0.130]   # |x|, |y| of the 4 rotor axes, z +0.0195
  prop_radius_m: 0.091             # 7.2" props
  body_reach_xy_m: 0.175           # frame / arms, without props
  reach_xy_m: 0.252                # swept prop tips, horizontal
  reach_3d_m: 0.253                # any point of the airframe, any attitude
  z_range_m: [-0.068, 0.052]       # landing gear .. top
  # Clearance-scoring radius for BOTH Starling airframes (runner
  # --drone-radius default via registry.vehicle_drone_radius): the real
  # airframe's reach_3d rounded up to the cm -- the question every Starling
  # eval answers is "would the Starling 2 Max clear this path". The log
  # samples at 50 Hz (<= 2.4 cm apart at 1.5 m/s), so no further margin.
  collision_radius_m: 0.26
  # --vehicle starling2max_iris: the Iris body mesh + Iris props (0.129 m)
  # moved to (+-0.085, +-0.0625) -- what `starling2max` flew until 2026-09-29.
  # Its extent is the IRIS body's arms/motor pods, not the props: that mesh
  # (a PhysX collider) can touch an obstacle at clearance 0 .. +0.014 m
  # scored at 0.26.
  iris_frame:
    body_reach_xy_m: 0.273
    props_reach_xy_m: 0.235
    reach_xy_m: 0.273
    reach_3d_m: 0.274
    z_range_m: [-0.067, 0.047]

# Measured in Isaac + PX4 SITL (superfly harness, airstation03), not assumed.
# Motor map omega = 730 u + 100 rad/s (u = 1 at max_rotor_velocity), PX4
# airframe none_iris (10016, Iris gains), for both Starling airframes; 0.666
# was probed on starling2max_iris (the sys-ID body on the Pegasus Iris frame).
isaac_px4:
  # PX4's collective thrust in a position-held hover (hover_probe method,
  # 2026-09-29: median 0.6662, p10-p90 0.6652-0.6669, 569 settled samples;
  # predicted (sqrt(m g / 4 / kT) - 100) / 730 = 0.667). The same probe on the
  # Iris reads 0.5807, the agile_student default 0.577 (measured 2026-09-16).
  hover_throttle: 0.666
