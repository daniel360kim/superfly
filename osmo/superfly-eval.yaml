# Run the superfly comparison harness (Isaac Sim + PX4 SITL) on OSMO.
# Successor to the pre-reorg osmo/superfly.yaml (workflow `gsds-superfly`):
# same measured workarounds, gsds methods removed, superfly-* workflow name
# (daily_log buckets OSMO activity by substring match on the name).
#
# Feasibility was established by probes gsds-isaacprobe-1 / isaacboot3-1 /
# vkprobe-1 / renderprobe-1 (2026-07-29). Key measured facts those produced,
# because they are non-obvious and drive this file's shape:
#
#   * OSMO `default`-pool GPUs are RTX PRO 5000 Blackwell, 48 GiB, driver
#     580.126.20 -- MORE VRAM than the local 5090 (32 GiB).
#   * NVIDIA_DRIVER_CAPABILITIES advertises only "compute,utility", but the
#     graphics stack is fully injected anyway: all /dev/nvidia* nodes exist and
#     `vulkaninfo` enumerates the GPU as PHYSICAL_DEVICE_TYPE_DISCRETE_GPU.
#     Isaac's RTX renderer works. Do not be misled by that env var.
#   * libGL.so.1 is NOT in the pytorch image; without it Kit loads but
#     rtx.neuraylib fails and every frame comes back empty. apt is fast here
#     (~25 s), so no offline .deb cache is needed for THIS eval image -- unlike
#     the 58 min apt tax documented in INFRASTRUCTURE_OSMO.md for other images
#     (a training image likely does need the deps cache).
#   * `pip install isaacsim[all,extscache]` takes ~3m20s. It also DOWNGRADES
#     torch to 2.7.0/cu126, which has no sm_120 kernels -- hence the separate
#     /opt/policy venv on cu128 for the policies. Isaac keeps its own torch;
#     run_comparison.py already runs each method in its own interpreter.
#   * First render costs ~2 min of shader compilation. Submit WHOLE CAMPAIGNS
#     per job, never one trial per job.
#
# Method coverage on OSMO, honestly stated:
#   * diffaero -- READY: its exported_actor.pt2 is self-contained TorchScript,
#     /opt/policy (torch cu128) is all it needs.
#   * depthnav -- needs methods/depthnav staged (git submodule, Phase 1) so
#     DEPTHNAV_ROOT resolves; /opt/policy covers its torch/gymnasium/yaml deps.
#   * agile    -- NOT wired here yet: needs TF-cpu + casadi + an acados build
#     in-container (the staged acados/lib is compiled for the workstation);
#     never proven on OSMO. Run agile trials on airstation03 instead.
#
# Usage:
#   scripts/stage_superfly_osmo.sh 0817
#   osmo workflow submit osmo/superfly-eval.yaml --pool default \
#     --set-env SUPERFLY_S3_KEY_ID=$S3ID SUPERFLY_S3_KEY=$S3KEY \
#     --set-string data_tar=superfly_stage_0817.tar tag=eval1 \
#       scenarios=suites/poster_suite_v1.json methods="depthnav diffaero" \
#       extra_args="--max-speed 3.0"
version: 2
default-values:
  data_tar: superfly_stage.tar
  scenarios: suites/poster_suite_v1.json
  methods: depthnav diffaero
  extra_args: "--max-speed 3.0"
  tag: run
  # eval-albedo A/B surface: "fixed" (default, byte-identical benchmark) or
  # "random" (per-seed deterministic per-obstacle colors). Exported inside
  # fly.sh because su/setpriv does not reliably pass --set-env through.
  albedo: fixed
workflow:
  name: superfly-eval
  groups:
  - name: superfly-group
    tasks:
    - name: fly
      lead: true
      image: pytorch/pytorch:2.9.1-cuda13.0-cudnn9-devel
      resource: gpu_resource
      inputs:
      - url: s3://superfly/tmp_data/
        regex: '{{ data_tar }}$'
      command:
      - bash
      - -c
      - |
        set -ex
        export OMNI_KIT_ACCEPT_EULA=YES ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive

        # ---- system libs Kit's RTX plugin dlopens (~25 s) ----
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          libgl1 libglu1-mesa libegl1 libglx0 libopengl0 libvulkan1 \
          libxrandr2 libxinerama1 libxcursor1 libxi6 libxt6 libxfixes3 \
          libxrender1 libxkbcommon0 libsm6 libice6 libfontconfig1 \
          libgomp1 libatomic1 libnss3 libasound2 ffmpeg > /dev/null
        ldconfig -p | grep -q 'libGL\.so\.1' || { echo "LIBGL_MISSING_ABORT"; exit 1; }

        # ---- stage ----
        cd /osmo/run/workspace
        tar -xf {{input:0}}/{{ data_tar }}
        STAGE=/osmo/run/workspace/superfly_stage
        REPO=$STAGE/superfly
        export PYTHONPATH=$STAGE/PegasusSimulator/extensions/pegasus.simulator

        # PX4 expects to exec from its build tree; restore the bit rsync can't carry.
        chmod +x $STAGE/px4/build/px4_sitl_default/bin/px4*

        # ---- Isaac Sim into the base env (its own torch, its own python) ----
        pip install --no-cache-dir "isaacsim[all,extscache]==5.1.0" \
          --extra-index-url https://pypi.nvidia.com > /dev/null
        # run_px4_sim.py imports pegasus ... px4_mavlink_backend under THIS
        # interpreter, so pymavlink (+ scipy for superfly.common) must exist
        # here too, not just in /opt/policy.
        pip install --no-cache-dir pymavlink scipy > /dev/null
        SIM_PY=$(which python)

        # superfly.sim.px4_sim does `import carb` BEFORE `from isaacsim import
        # SimulationApp`. carb lives in Isaac's kit kernel, which only lands on
        # sys.path via the isaacsim package init -- locally that happens because
        # the harness is launched through isaacsim/python.sh, but here
        # --sim-python is /opt/conda/bin/python. A sitecustomize (auto-imported
        # at interpreter startup) reproduces python.sh's path setup without
        # editing the harness. It only adjusts sys.path; it does NOT boot Kit,
        # so non-Isaac uses of this interpreter are unaffected.
        SITE=$(python -c "import site; print(site.getsitepackages()[0])")
        cat > $SITE/sitecustomize.py <<'PYEOF'
        try:
            import isaacsim  # noqa: F401  (puts carb/omni on sys.path)
        except Exception:
            isaacsim = None


        # ---- /rtx/dataWindowNDC/* must exist before any camera readback ----
        # omni.replicator.core annotator_utils._resize_data_for_overscan does:
        #     x = settings.get("/rtx/dataWindowNDC/0")   # ... /1 /2 /3
        #     if (not fitOutputToDataWindow) and is2DArray and (x != 0 or ...):
        #         data_original_width = round(data.shape[0] / (z - x))
        # In a bare container those settings are never registered, so get()
        # returns None; `None != 0` is True, the guard PASSES, and it evaluates
        # `None - None` -> TypeError, which surfaces as
        #     "sim loop exit after 0.0s: exception TypeError: unsupported
        #      operand type(s) for -: 'NoneType' and 'NoneType'"
        # and kills every trial (gsds-superfly-5). The local workstation has the
        # SAME replicator build (1.12.27+107.3.3) -- it simply has these settings
        # registered, so the branch is a no-op there.
        #
        # (0,0,1,1) is the identity data window (full frame): z-x = w-y = 1 and
        # both offsets are 0, so the crop returns the array unchanged -- i.e.
        # exactly the no-overscan behaviour, matching local results.
        if isaacsim is not None:
            _orig_init = isaacsim.SimulationApp.__init__

            # Settings Kit reads AT STARTUP (async rendering especially) cannot
            # be changed once the app is up, so they go in as Kit CLI args.
            # SimulationApp forwards `--/`-prefixed argv to the Kit app, and
            # run_px4_sim.py uses parse_known_args so its own argparse ignores
            # them. This MUST happen inside __init__, not at sitecustomize import
            # time: sitecustomize runs for every invocation of this interpreter,
            # and polluting sys.argv globally broke `python -m venv` with
            # "unrecognized arguments: --/app/asyncRendering=false"
            # (gsds-superfly-8).
            # NOTE on what is deliberately NOT set here: asyncRendering=false and
            # hydraEngine/waitIdle=true were tried (gsds-superfly-9/10). They
            # serialize the render loop and dropped realtime_factor to 0.308 vs
            # 0.798 for the identical trial locally. Because the sim is NOT
            # lockstepped (Pegasus logs enable_lockstep=False) the offboard runs
            # at a fixed wall-clock rate, so a slower RTF means fewer control
            # updates per simulated second -- the OSMO drone crawled
            # (mean_speed 0.54 vs 2.48 local) and never reached the goal.
            # Throughput here is a CORRECTNESS property, not just cost.
            # The empty frames those flags were meant to fix were really the
            # root-owned-install permission bug, fixed by chown above.
            _KIT_ARGS = ("--/omni/replicator/captureOnPlay=true",
                         "--/app/renderer/skipWhileMinimized=false")

            def _init_with_datawindow(self, *args, **kwargs):
                import sys as _sys
                for _a in _KIT_ARGS:
                    if _a not in _sys.argv:
                        _sys.argv.append(_a)
                _orig_init(self, *args, **kwargs)
                try:
                    import carb
                    s = carb.settings.get_settings()
                    for i, v in enumerate((0.0, 0.0, 1.0, 1.0)):
                        if s.get(f"/rtx/dataWindowNDC/{i}") is None:
                            s.set(f"/rtx/dataWindowNDC/{i}", v)

                    # Capture-on-play so world.step(render=True) after
                    # timeline.play() yields frames.
                    # Async rendering is left at its default ON -- see the
                    # _KIT_ARGS note above: disabling it costs ~2.6x throughput,
                    # which changes the flight itself in a non-lockstep sim.
                    s.set("/omni/replicator/captureOnPlay", True)
                    s.set("/app/renderer/skipWhileMinimized", False)

                    # Print what actually took effect -- these settings are the
                    # difference between real frames and silently-empty ones,
                    # so make it visible in the job log rather than inferred.
                    print("[superfly-osmo] dataWindowNDC="
                          + str([s.get(f"/rtx/dataWindowNDC/{i}") for i in range(4)])
                          + " captureOnPlay="
                          + str(s.get("/omni/replicator/captureOnPlay"))
                          + " asyncRendering="
                          + str(s.get("/app/asyncRendering")), flush=True)
                except Exception as _e:
                    print("[superfly-osmo] settings patch FAILED:", repr(_e), flush=True)

            isaacsim.SimulationApp.__init__ = _init_with_datawindow
        PYEOF
        python -c "import carb; print('carb import OK before SimulationApp')"

        # ---- policy venv: cu128 torch (sm_120), isolated from Isaac's cu126 ----
        # (no --system-site-packages: that is the default and the flag takes no value)
        python -m venv /opt/policy
        /opt/policy/bin/pip install --no-cache-dir -q --upgrade pip
        # torchvision rides the same cu128 index so the pair stays matched:
        # depthnav's extractors import `from torchvision import models`
        # (superfly-eval-7 died at the depthnav_vel import preflight without
        # it -- the 2026-07 torchvision incident all over again, the
        # preflight caught it in 2 min this time).
        /opt/policy/bin/pip install --no-cache-dir -q \
          torch torchvision --index-url https://download.pytorch.org/whl/cu128
        /opt/policy/bin/pip install --no-cache-dir -q \
          numpy scipy pymavlink pyyaml gymnasium opencv-python-headless
        # the superfly package itself (common layer + policy cores), no deps.
        /opt/policy/bin/pip install --no-cache-dir -q --no-deps -e $REPO
        /opt/policy/bin/python -c "
        import torch
        print('policy torch', torch.__version__, 'cuda', torch.cuda.is_available())
        assert torch.cuda.is_available(), 'POLICY_TORCH_NO_CUDA'
        # sm_120 kernels must actually exist, not just report available.
        (torch.zeros(8, device='cuda') + 1).sum().item()
        print('sm_120 kernel launch OK')
        "

        # ---- non-root user to run the harness (REQUIRED, not hygiene) ----
        # run_comparison.py's stale-process sweep does
        #     pgrep -u $(id -u) -f run_px4_sim.py   -> SIGTERM each pid
        # and on OSMO both PID 1 (/osmo/bin/osmo_exec) and the job's bash carry
        # the ENTIRE job script in their cmdline and run as root. As root the
        # sweep therefore matches and SIGTERMs its own container init --
        # observed in gsds-superfly-2: "[cleanup] SIGTERMed 2 stale
        # run_px4_sim.py process(es): [1, 60]", killing the job mid-trial.
        # Running as a different uid makes those processes unmatchable, with no
        # edit to the harness (so OSMO and local behaviour stay identical).
        useradd -m -d /home/flyer -s /bin/bash flyer
        chown -R flyer:flyer $STAGE /opt/policy
        mkdir -p /home/flyer/.cache && chown -R flyer:flyer /home/flyer
        # Kit runs --portable, so it writes its data/shader/material/kvdb caches
        # INSIDE the install tree rather than under $HOME. Running as flyer with
        # a root-owned install produced (gsds-superfly-7):
        #   "Failed to create directory .../isaacsim/kit/data/documents/..."
        #   "[rtx.neuraylib.plugin] Cannot find `Documents/Kit/shared` directory"
        #   "[omni.kvdb.plugin] Unexpected key-value database error"
        # i.e. the renderer could not initialise its caches. Metadata-only op.
        chown -R flyer:flyer $SITE/isaacsim

        # ---- pre-flight: each method's policy core must import, or the
        # "results" are fiction ----
        # run_comparison.py treats an offboard that dies at import as a completed
        # trial (rc=0, success 0.00, speed 0.00) -- a dead policy looks exactly
        # like a bad one (gsds-superfly-9). Fail loudly HERE instead of burning
        # a campaign and reporting zeros as if they were flight outcomes.
        for M in {{ methods }}; do
          case $M in
            diffaero*) IMP="superfly.policies.diffaero" ;;
            depthnav*) IMP="superfly.policies.depthnav" ;;
            agile)     echo "AGILE_NOT_WIRED_ON_OSMO_ABORT"; exit 1 ;;
          esac
          DEPTHNAV_ROOT=$REPO/methods/depthnav /opt/policy/bin/python -c "
        import importlib; importlib.import_module('$IMP')
        print('[superfly-osmo] $M policy imports OK')
        " || { echo "OFFBOARD_IMPORT_FAILED_ABORT ($M)"; exit 1; }
        done

        # ---- fly ----
        RESULTS=$REPO/results/{{ tag }}
        cat > /tmp/fly.sh <<FLYEOF
        set -x
        export HOME=/home/flyer
        export OMNI_KIT_ACCEPT_EULA=YES ACCEPT_EULA=Y
        export PYTHONPATH=$PYTHONPATH
        export DEPTHNAV_ROOT=$REPO/methods/depthnav
        export GSDS_OBSTACLE_ALBEDO={{ albedo }}
        # asset surface sampling group-OOM-kills the 32Gi container (jobs
        # 32/33) and has never produced usable samples anywhere; scoring
        # falls back to the analytic field either way. Always skip on OSMO.
        export GSDS_SKIP_OBST_SAMPLING=1
        # omniverse:// Nucleus URLs cannot authenticate in the container, so
        # the tarball ships the stages (usd_stages/) and run_comparison.py
        # retargets the scenario JSONs' omniverse://.../Library/Stages/<X>
        # refs to \$GSDS_USD_STAGE_ROOT/<X> at the point of use (JSONs +
        # mesh-cache keys unchanged). The require-stage guard aborts a trial
        # instead of silently flying an empty void if a stage fails to
        # compose (jobs 32/33).
        export GSDS_USD_STAGE_ROOT=$STAGE/usd_stages
        export GSDS_REQUIRE_STAGE=1
        cd $REPO
        $SIM_PY -u scripts/run_comparison.py configs/scenarios/{{ scenarios }} \
          --methods {{ methods }} \
          --depthnav-python /opt/policy/bin/python \
          --depthnav_vel-python /opt/policy/bin/python \
          --depthnav_vel_planar-python /opt/policy/bin/python \
          --diffaero-python /opt/policy/bin/python \
          --diffaero_vel-python /opt/policy/bin/python \
          --diffaero_vel_planar-python /opt/policy/bin/python \
          --sim-python $SIM_PY \
          --px4-dir $STAGE/px4 \
          --results-dir $RESULTS \
          --headless --report --record-video --warmup 60 \
          {{ extra_args }}
        FLYEOF
        chmod +x /tmp/fly.sh
        set +e
        if command -v setpriv > /dev/null; then
          setpriv --reuid=$(id -u flyer) --regid=$(id -g flyer) --init-groups \
            bash /tmp/fly.sh
        else
          su flyer -c "bash /tmp/fly.sh"
        fi
        FLY_RC=$?
        set -e
        echo "run_comparison rc=$FLY_RC"

        # ---- ship results out (container scratch vanishes on exit) ----
        cd $REPO/results
        tar -czf /tmp/superfly_results_{{ tag }}.tar.gz {{ tag }} || true
        PYTHONPATH=$REPO/src python -m superfly.remote_store upload \
          /tmp/superfly_results_{{ tag }}.tar.gz \
          "runs/{{ tag }}/superfly_results_{{ tag }}.tar.gz" || echo "UPLOAD_FAILED"

        echo "SUPERFLY_DONE rc=$FLY_RC"
        exit $FLY_RC
  resources:
    gpu_resource:
      # cpu/mem per INFRASTRUCTURE_OSMO.md's right-sizing rule. storage is
      # generous because Isaac's extscache + shader cache land on container
      # scratch; the node has ~3.7 TB free, so this is not the packing
      # constraint.
      cpu: 8
      gpu: 1
      memory: 32Gi
      storage: 200Gi
