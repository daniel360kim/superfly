# Train a DiffAero policy on OSMO and mirror the run dir (with its exported
# deployable actor) to s3://superfly/runs/<tag>/.
#
# Unlike the eval job (osmo/superfly-eval.yaml), a TRAINING image likely
# needs the per-project offline deps cache (deps/deps_cache_v1.tar,
# INFRASTRUCTURE_OSMO.md): the eval job's apt set installs in ~25 s, but a
# trainer that apt-installs anything heavier eats the measured 58-minute
# apt tax. Build the cache with a one-time CPU job before relying on this
# at scale; until then this job installs online and eats the tax if the apt
# mirror is slow that day.
#
# PENDING (Phase 1): methods/diffaero must exist in the staged tarball --
# stage_superfly_osmo.sh ships the repo INCLUDING submodule working trees
# once they are cloned. Until then this workflow aborts at the preflight.
#
# Usage:
#   scripts/stage_superfly_osmo.sh 0817
#   osmo workflow submit osmo/superfly-train-diffaero.yaml --pool default \
#     --set-env SUPERFLY_S3_KEY_ID=$S3ID SUPERFLY_S3_KEY=$S3KEY \
#     --set-string data_tar=superfly_stage_0817.tar tag=sha2c_pmc_v2 \
#       overrides="env=oa algo=sha2c dynamics=pmc sensor=camera"
version: 2
default-values:
  data_tar: superfly_stage.tar
  overrides: "env=oa algo=sha2c dynamics=pmc sensor=camera"
  tag: diffaero_run
workflow:
  name: superfly-train-diffaero
  groups:
  - name: train-group
    tasks:
    - name: train
      lead: true
      image: pytorch/pytorch:2.9.1-cuda13.0-cudnn9-devel
      resource: gpu_resource
      inputs:
      - url: s3://superfly/tmp_data/
        regex: '{{ data_tar }}$'
      command:
      - bash
      - -c
      - |
        set -ex
        export DEBIAN_FRONTEND=noninteractive
        # ---- system libs (~25 s, same mirror behavior as the eval job's
        # set): taichi dlopens libX11, cv2 needs libGL+glib, open3d needs
        # libGL/gomp. Without libX11 train.py dies at `import taichi`
        # (superfly-train-diffaero-12). ----
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          libx11-6 libgl1 libglu1-mesa libegl1 libglx0 libopengl0 \
          libxrender1 libxext6 libsm6 libice6 libgomp1 libatomic1 \
          libglib2.0-0 > /dev/null
        cd /osmo/run/workspace
        tar -xf {{input:0}}/{{ data_tar }}
        STAGE=/osmo/run/workspace/superfly_stage
        REPO=$STAGE/superfly

        # ---- preflight: the submodule must actually be in the tarball ----
        [ -f $REPO/methods/diffaero/script/train.py ] || {
          echo "DIFFAERO_SUBMODULE_MISSING_ABORT (Phase 1 not staged)"; exit 1; }

        # pytorch3d: no PyPI distribution, no git in this image, and its C++
        # extension build races torch-version drift -- but diffaero only uses
        # pytorch3d.transforms, which is pure Python (verified by grep: every
        # import site is `pytorch3d.transforms`). So: fetch the source tarball
        # and copy the python package into site-packages, skipping the build
        # entirely. If diffaero ever grows a dependency on a compiled
        # pytorch3d op, this fails loudly at that op's import.
        grep -v "^pytorch3d" $REPO/methods/diffaero/requirements.txt > /tmp/req.txt
        # boto3: not a diffaero dep, but the mirror step below runs
        # superfly.remote_store (train-15 died at the upload without it).
        pip install --no-cache-dir -q -r /tmp/req.txt boto3
        python - <<'P3DEOF'
        import site, tarfile, urllib.request, glob, shutil
        url = "https://github.com/facebookresearch/pytorch3d/archive/refs/tags/stable.tar.gz"
        urllib.request.urlretrieve(url, "/tmp/p3d.tar.gz")
        with tarfile.open("/tmp/p3d.tar.gz") as t:
            t.extractall("/tmp/p3d")
        src = glob.glob("/tmp/p3d/pytorch3d-*/pytorch3d")[0]
        shutil.copytree(src, site.getsitepackages()[0] + "/pytorch3d")
        P3DEOF
        python -c "import pytorch3d.transforms; print('pytorch3d.transforms OK (pure-python copy)')"
        # make `import diffaero` + `import superfly` work everywhere
        pip install --no-cache-dir -q --no-deps -e $REPO/methods/diffaero
        pip install --no-cache-dir -q --no-deps -e $REPO

        OUT=$REPO/checkpoints/DiffAero/{{ tag }}
        python $REPO/scripts/train_diffaero.py --out $OUT \
          --python $(which python) --config {{ overrides }}

        # ---- mirror the run dir out (container scratch vanishes on exit) ----
        cd $REPO/checkpoints/DiffAero
        tar -czf /tmp/{{ tag }}.tar.gz {{ tag }}
        PYTHONPATH=$REPO/src python -m superfly.remote_store upload \
          /tmp/{{ tag }}.tar.gz "runs/{{ tag }}/{{ tag }}.tar.gz"
        echo "TRAIN_DONE"
  resources:
    gpu_resource:
      # right-sized DOWN from the doc's 8/32Gi guidance: this trainer is a
      # fully on-GPU sim (no dataloader workers); 2026-08-17 the shared
      # nodes were CPU-starved by other tenants with 11/12 GPUs idle, and
      # cpu=8 was exactly what kept the job unschedulable.
      cpu: 2
      gpu: 1
      memory: 16Gi
      # 40Gi is ample (148 MB tarball + ~6 GB pip deps); 100Gi blocked
      # scheduling on nodes short only on ephemeral-storage (2026-08-17).
      storage: 40Gi
